<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bluegray Ink</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="background-pattern"></div>

  <div class="container">
    <img src="logo.png" alt="Bluegray Ink Logo" class="logo" />
    <h1>Bluegray Ink</h1>
    <p class="subtitle">Custom Deskmat from Indonesia</p>

    <div class="socials">
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-tiktok"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-youtube"></i></a>
      <a href="#"><i class="fab fa-twitch"></i></a>
    </div>

    <div class="section">
      <h2>Local Store (Indonesia)</h2>
      <a href="#" class="button">
        Tokopedia <i class="fas fa-store"></i>
      </a>
    </div>

    <div class="section">
      <h2>International Store</h2>
      <a href="#" class="button">
        Ko-fi <i class="fas fa-mug-hot"></i>
      </a>
    </div>

    <div class="section">
      <h2>Contact Us</h2>
      <div class="contact-buttons">
        <a href="mailto:example@email.com"><i class="fas fa-envelope"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
      </div>
    </div>
  </div>
</body>
</html>
